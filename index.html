<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bg-primary d-flex justify-content-center align-items-center">
      <div class="container">
        <h1 class="text-white text-center">Vremea It School</h1>
      </div>
    </header>

    <main>
      <section class="choose-location py-5">
        <div class="container">
          <h2 class="text-primary text-center mb-5">Alege Locatia</h2>
          <p class="text-center fs-6">
            Alege una din locatii pentru a vedea vremea din orasul tau
          </p>
          <p class="text-center fs-5">
            Orasul tau curent este <strong>Bucuresti.</strong>
          </p>
          <div class="dropdown d-flex justify-content-center">
            <button
              class="btn btn-secondary dropdown-toggle"
              type="button"
              id="dropdownMenuButton1"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Alege un alt oras
            </button>
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
              <li>
                <button class="dropdown-item bucharest">București</button>
              </li>
              <li>
                <button class="dropdown-item timisoara">Timișoara</button>
              </li>
              <li>
                <button class="dropdown-item oradea">Oradea</button>
              </li>
            </ul>
          </div>
        </div>
      </section>
      <section class="py-5 bg-secondary">
        <div class="container">
          <h2 class="text-primary text-center mb-5">Vremea Curenta</h2>
          <div class="current-weather"></div>
        </div>
      </section>

      <section class="py-5">
        <div class="container">
          <h2 class="text-primary text-center mb-5">Prognoza pe 5 zile</h2>
          <div class="weather-forecast"></div>
        </div>
      </section>
    </main>

    <footer class="bg-dark">
      <div class="container">
        <p class="text-light text-center m-0 py-3">
          IT School © 2026. Toate drepturile rezervate
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
